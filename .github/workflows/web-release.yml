name: Web Release

on:
  push:
    tags:
      - 'web-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without prefix, e.g. 0.1.1'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: web-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sharesdu-web

jobs:
  release:
    name: Build and publish Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG_NAME="web-v${VERSION}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${TAG_NAME#web-v}"
          fi

          if [ -z "$VERSION" ]; then
            echo "Unable to resolve release version from tag: ${TAG_NAME}" >&2
            exit 1
          fi

          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_LC}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ShareSDU Web v${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## ShareSDU Web v${{ steps.version.outputs.version }}

            Docker image published to GitHub Container Registry.

            ### Pull image

            ```bash
            docker pull ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ```

            ### Run (HTTP only)

            ```bash
            docker run -d --name sharesdu-web -p 80:80 ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ```

            ### Run with HTTPS

            Mount your TLS certificates into the container:

            ```bash
            docker run -d --name sharesdu-web \
              -p 80:80 -p 443:443 \
              -v /path/to/cert.pem:/etc/ssl/certs/cert.pem:ro \
              -v /path/to/privkey.pem:/etc/ssl/private/privkey.pem:ro \
              -v /path/to/chain.pem:/etc/ssl/certs/chain.pem:ro \
              ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ```

            Or use `web/docker-compose.yml` after placing certs under `web/certs/`.

            ### Image digest

            `${{ steps.build.outputs.digest }}`
